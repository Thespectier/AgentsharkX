[build-system]
requires = ["setuptools==80.9.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshark-demo-agent"
version = "0.1.0"
description = "Deterministic AgentsharkX Phase 16 demo agent and internal runner"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
dependencies = [
  "agentguard==2.1",
  "agentshark==0.1.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "langchain-core==1.3.3",
  "langgraph==1.1.10",
  "mcp==1.29.0",
  "pydantic==2.13.4",
  "uvicorn==0.52.0",
]

[project.scripts]
agentshark-demo-run = "agentshark_demo.cli:main"
agentshark-demo-runner = "agentshark_demo.runner.service:main"
agentshark-demo-fixtures = "agentshark_demo.fixtures.app:main"

[dependency-groups]
dev = [
  "mypy==1.18.2",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "ruff==0.14.14",
]

[tool.uv.sources]
agentguard = { git = "https://github.com/WhitzardAgent/AgentGuard.git", rev = "4b755fb4a4a2763b7e817b3d0220fe5c22187b59" }
agentshark = { path = "../../sdk/python" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentshark_demo = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agentshark_demo"]

[[tool.mypy.overrides]]
module = ["agentguard", "agentguard.*", "mcp", "mcp.*"]
ignore_missing_imports = true
