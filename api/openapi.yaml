      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmProviderMutationRequest'
      responses:
        '201':
          description: Provider configuration saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmMutationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'

  /api/v1/connect/llm/providers/{resourceId}:
    get:
      tags: [Connect]
      operationId: getProvider
      summary: Get one explicitly configured provider
      x-implementation-phase: 3
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Provider detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
    patch:
      tags: [Connect]
      operationId: updateLlmProvider
      summary: Update one verified agentgateway LLM provider configuration
      x-implementation-phase: 8
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmProviderMutationRequest'
      responses:
        '200':
          description: Provider configuration saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmMutationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
