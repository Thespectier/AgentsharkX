          items: { $ref: '#/components/schemas/TraceLink' }
        coverage: { $ref: '#/components/schemas/TraceCoverage' }
        totalSpans: { type: integer, minimum: 0 }
        totalLinks: { type: integer, minimum: 0 }
        spansTruncated: { type: boolean }
        linksTruncated: { type: boolean }
    TraceDetailEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/TraceDetail' }
        meta: { $ref: '#/components/schemas/Meta' }
    TraceEvent:
      type: object
      additionalProperties: false
      required: [name, time, attributes, droppedAttributesCount]
      properties:
        name: { type: string }
        time: { type: string, format: date-time }
        attributes:
          type: object
          additionalProperties: true
        droppedAttributesCount: { type: integer, minimum: 0, maximum: 4294967295 }
    TracePayload:
      type: object
      additionalProperties: false
      required: [kind, contentType, encoding, redactionState, sizeBytes, expiresAt, createdAt]
      properties:
        kind: { type: string }
        contentType: { type: string }
        encoding: { type: string }
        payloadBytes:
          type: string
          format: byte
          description: Base64-encoded retained bytes, used when bounded content is not complete valid JSON.
        payloadJson:
          description: Complete retained JSON value. Exactly one of payloadJson and payloadBytes is present.
        redactionState:
          type: string
          enum: [captured, redacted, truncated]
        sizeBytes: { type: integer, format: int64, minimum: 0 }
        expiresAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    TraceSpanDetail:
      type: object
      additionalProperties: false
      required: [span, attributes, resource, events, payloads]
      properties:
        span: { $ref: '#/components/schemas/TraceSpan' }
        statusMessage: { type: string }
        attributes:
          type: object
          description: Raw non-content Span attributes after Collector credential and payload separation.
          additionalProperties: true
        resource:
          type: object
          description: Raw non-credential OTLP Resource attributes retained for the Span.
          additionalProperties: true
        events:
          type: array
          items: { $ref: '#/components/schemas/TraceEvent' }
        payloads:
          type: array
          description: Unexpired retained content. An empty array is paired with the Span contentState and never represented as a fabricated empty payload.
          items: { $ref: '#/components/schemas/TracePayload' }
    TraceSpanDetailEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/TraceSpanDetail' }
        meta: { $ref: '#/components/schemas/Meta' }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            source:
              $ref: '#/components/schemas/Source'
            requestId:
              type: string
            retryable:
              type: boolean
            failedChecks:
              type: array
              description: Required Demo Lab readiness checks that were not healthy when a create request returned DEMO_NOT_READY.
              items: { $ref: '#/components/schemas/DemoStatusComponent' }
