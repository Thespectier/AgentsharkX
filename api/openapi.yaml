components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: agentshark_session

  parameters:
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    AgentIdFilter:
      name: agentId
      in: query
      required: false
      schema:
        type: string
        maxLength: 256
    ToolName:
      name: tool
      in: path
      required: true
      description: Opaque AgentsharkX tool resource ID, not an inferred or user-supplied upstream name
      schema:
        type: string
        minLength: 1
        maxLength: 256
    ScanId:
      name: scanId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    TrustResourceTypeFilter:
      name: type
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/TrustResourceType'
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
    TraceId:
      name: traceId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9A-Fa-f]{32}$'
    SpanId:
      name: spanId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9A-Fa-f]{16}$'
    TraceCursor:
      name: cursor
      in: query
      required: false
      description: Opaque keyset cursor pinned to the first page's immutable Trace-list watermark and active filters.
      schema:
        type: string
        maxLength: 512
    TraceStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/TraceStatus'
    TraceCompletenessFilter:
      name: completeness
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/TraceCompleteness'
    TraceAgentIdFilter:
      name: agent_id
      in: query
      required: false
      schema:
        type: string
        maxLength: 256
    TraceSessionIdFilter:
      name: session_id
      in: query
      required: false
      schema:
        type: string
        maxLength: 256
    TraceTaskIdFilter:
      name: task_id
      in: query
      required: false
      schema:
        type: string
        maxLength: 256
    TraceHasErrorFilter:
      name: has_error
      in: query
      required: false
      schema:
        type: boolean
    TraceHasA2AFilter:
      name: has_a2a
      in: query
      required: false
      schema:
        type: boolean
    TraceStartedAfterFilter:
      name: started_after
      in: query
      required: false
      description: Inclusive RFC 3339 lower bound for Trace start time.
      schema:
        type: string
        format: date-time
    TraceStartedBeforeFilter:
      name: started_before
      in: query
      required: false
      description: Exclusive RFC 3339 upper bound for Trace start time.
      schema:
        type: string
        format: date-time
    TraceQueryFilter:
      name: query
      in: query
      required: false
      description: Case-insensitive literal substring matched against Trace, Task, and Session IDs.
      schema:
        type: string
        maxLength: 200
    SourcePath:
      name: source
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Source'
    SourceFilter:
      name: source
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Source'
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 256
    Search:
      name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    DemoRunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Decimal stream_outbox sequence from the last processed SSE message. Omit the header to receive all currently retained messages; a supplied zero is a real cursor and can produce reset when the outbox is non-empty.
      schema:
        type: string
        pattern: '^(0|[1-9][0-9]*)$'
        maxLength: 19
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Stable client-provided idempotency key. The BFF generates one when omitted.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._-]+$'

  responses:
    DataResponse:
      description: Source-preserving response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DataEnvelope'
    Unauthorized:
      description: Authentication failed or session missing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: CSRF validation failed or the operation is forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: The BFF cannot safely complete the operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UpstreamUnavailable:
      description: The required upstream source is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadGateway:
      description: The upstream response no longer matches the pinned contract
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: The requested management object or persisted Trace record was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Object was already modified, is referenced, or another mutation is active
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationFailed:
      description: Upstream validation rejected the request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    Liveness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Readiness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ready
    StreamReset:
      type: object
      additionalProperties: false
      required: [reason, resumeAfter, oldestAvailable]
      properties:
        reason:
          type: string
          enum: [cursor_ahead, outbox_retention]
        resumeAfter:
          type: integer
          format: int64
          minimum: 0
          description: Latest known outbox sequence; use this value for the next stream connection after refetching REST state.
        oldestAvailable:
          type: integer
          format: int64
          minimum: 0
    HealthStatus:
      type: string
      enum: [healthy, degraded, down, unknown]
    DemoScenario:
      type: string
      enum: [happy, approval, failure]
    DemoRunStatus:
      type: string
      enum:
        [
          queued,
          starting,
          running,
          waiting_approval,
          succeeded,
          failed,
          cancelled,
          interrupted,
          expired,
        ]
    DemoRunOutcome:
      type: string
      enum: [none, normal, approved, denied, degraded, cancelled, failed]
    DemoMetrics:
      type: object
      additionalProperties: false
      required:
        [llmCalls, mcpCalls, localToolCalls, a2aCalls, humanChecks, errorCount]
      properties:
        llmCalls: { type: integer, minimum: 0 }
        mcpCalls: { type: integer, minimum: 0 }
        localToolCalls: { type: integer, minimum: 0 }
        a2aCalls: { type: integer, minimum: 0 }
        humanChecks: { type: integer, minimum: 0 }
        errorCount: { type: integer, minimum: 0 }
    DemoObservedMetrics:
      type: [object, 'null']
      additionalProperties: false
      required:
        [llmCalls, mcpCalls, localToolCalls, a2aCalls, humanChecks, errorCount]
      properties:
        llmCalls: { type: integer, minimum: 0 }
        mcpCalls: { type: integer, minimum: 0 }
        localToolCalls: { type: integer, minimum: 0 }
        a2aCalls: { type: integer, minimum: 0 }
        humanChecks: { type: integer, minimum: 0 }
        errorCount: { type: integer, minimum: 0 }
    DemoApproval:
      type: object
      additionalProperties: false
      required:
        [
          ticketId,
          upstreamId,
          source,
          fetchedAt,
          rawRef,
          sessionId,
          eventType,
          phase,
          action,
          riskScore,
          matchedRules,
          status,
          createdAt,
          correlationBasis,
        ]
      properties:
        ticketId: { type: string }
        upstreamId: { type: string }
        source: { $ref: '#/components/schemas/GuardSource' }
        fetchedAt: { type: string, format: date-time }
        rawRef: { $ref: '#/components/schemas/RawRef' }
        sessionId: { type: string }
