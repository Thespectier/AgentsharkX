openapi: 3.1.0
info:
  title: AgentsharkX BFF API
  version: 0.9.0-preview
  description: |
    Source-preserving management API above agentgateway and AgentGuard.
    Authentication, independent upstream health and capability probes, and
    agentgateway resource reads and revision-controlled LLM, MCP, Traffic, and
    gateway-policy configuration writes provide the management foundation. Trust adds
    source-preserving AgentGuard identities, resources, label updates, and
    bounded asynchronous scan orchestration. Protect adds authenticated complete
    LLM/model/MCP policy configuration, complete global LLM/MCP guardrail
    workflows, source-grouped summaries, AgentGuard
    runtime-rule check/publish/delete, per-agent plugin phases, and guarded
    approval decisions. Audit adds persistent PostgreSQL-backed
    gateway traffic and AgentGuard audit/session projections, source-scoped
    analytics, confirmed approval-resolution evidence, authenticated complete
    upstream detail, stable cursor pagination, and resumable normalized SSE
    backed by a durable outbox. Trace ingest remains a separate OTLP/HTTP
    protobuf Collector. Phase 15 adds authenticated, payload-safe Trace list and
    graph detail reads plus an explicit single-Span detail read for retained
    attributes, events, and content.
servers:
  - url: /
security:
  - sessionCookie: []
tags:
  - name: Auth
  - name: System
  - name: Connect
  - name: Trust
  - name: Protect
  - name: Audit
  - name: Demo

paths:
  /healthz:
    get:
      tags: [System]
      operationId: getLiveness
      summary: Report only that the AgentsharkX process is alive
      description: This endpoint does not check PostgreSQL, migrations, or either upstream.
      x-implementation-phase: 13
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'

  /readyz:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Report whether persistent storage is ready for Audit operations
      description: PostgreSQL must be reachable, every embedded migration must be applied with its recorded checksum, and persisted Audit history must have been restored into the current service state.
      x-implementation-phase: 13
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Persistent storage, migrations, and Audit history restoration are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/session:
    get:
      tags: [Auth]
      operationId: getAdminSession
      summary: Validate the browser session and refresh its CSRF token
      x-implementation-phase: 7
      x-implementation-status: implemented
      responses:
        '204':
          description: Session is valid
          headers:
            X-CSRF-Token:
              schema:
                type: string
              description: Token required by subsequent mutating requests
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Auth]
      operationId: createAdminSession
      summary: Exchange the configured admin token for a browser session
      x-implementation-phase: 2
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Session cookie created
          headers:
            X-CSRF-Token:
              schema:
                type: string
              description: Token required by subsequent mutating requests
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/system/health:
    get:
      tags: [System]
      operationId: getSystemHealth
      summary: Return independent health state for both upstream sources
      x-implementation-phase: 2
      x-implementation-status: implemented
      responses:
        '200':
          description: Source-scoped health result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/system/capabilities:
    get:
      tags: [System]
      operationId: getCapabilities
      summary: Return the probe-based capability registry
      x-implementation-phase: 2
      x-implementation-status: implemented
      responses:
        '200':
          description: Capability registry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/system/diagnostics:
    get:
      tags: [System]
      operationId: getSystemDiagnostics
      summary: Return source-specific, secret-safe recovery guidance
      x-implementation-phase: 7
      x-implementation-status: implemented
      responses:
        '200':
          description: Actionable diagnostics derived from independent health probes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/overview:
    get:
      tags: [System]
      operationId: getOverview
      summary: Aggregate source health without fabricating later-phase business data
      x-implementation-phase: 2
      x-implementation-status: implemented
      responses:
        '200':
          description: Partial results are returned with source-scoped metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/stream:
    get:
      tags: [System]
      operationId: streamEvents
      summary: Subscribe to persistent normalized Audit events and Trace summary changes
      description: |
        Every SSE id is the decimal stream_outbox sequence. A reconnecting client
        supplies that value as Last-Event-ID; the server replays retained rows
        before waiting for commit notifications. If the supplied sequence is
        ahead of the database or older than the retained outbox window, the
        server emits one reset event with a StreamReset JSON body. Audit event
        names carry a payload-safe UnifiedEvent with raw omitted; the trace
        event name carries only TraceSummary and never includes Span
        attributes, events, links, or a retained payload. Persistent replay is
        polled independently of in-process notifications so Collector-process
        commits become visible promptly.
      x-implementation-phase: 15
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/LastEventId'
      responses:
        '200':
          description: Server-sent event stream with persistent integer IDs, reset events, and heartbeat comments
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/demo/status:
    get:
      tags: [Demo]
      operationId: getDemoStatus
      summary: Return Demo Lab enablement, readiness, and the active Run
      description: This authenticated endpoint remains available when Demo Lab is disabled. Disabled Demo Lab never exposes a writable Runner control path.
      x-implementation-phase: 16
      x-implementation-status: implemented
      responses:
        '200':
          description: Demo Lab status and independently reported component checks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoStatusEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/demo/scenarios:
    get:
      tags: [Demo]
      operationId: listDemoScenarios
      summary: List the immutable deterministic Demo scenarios
      x-implementation-phase: 16
      x-implementation-status: implemented
      responses:
        '200':
          description: Fixed scenarios and their expected capability counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoScenariosEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/demo/runs:
    get:
      tags: [Demo]
      operationId: listDemoRuns
      summary: List persisted Demo Run control records
      x-implementation-phase: 16
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Stable Demo Run history restored from PostgreSQL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoRunListEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Demo]
      operationId: createDemoRun
      summary: Start one fixed deterministic Demo scenario
      description: X-Request-ID is the idempotency key. An identical retry returns the persisted Run and never starts a second Runner execution.
      x-implementation-phase: 16
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DemoCreateRunRequest' }
      responses:
        '202':
          description: Run was persisted and accepted by the internal Runner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoRunEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/demo/runs/{runId}:
    get:
      tags: [Demo]
      operationId: getDemoRun
      summary: Return one persisted Demo Run with verified correlation evidence
      x-implementation-phase: 16
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/DemoRunId'
      responses:
        '200':
          description: Current Run projection; observed metrics remain null until matching Trace evidence exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoRunEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/demo/runs/{runId}/cancel:
    post:
      tags: [Demo]
      operationId: cancelDemoRun
      summary: Cooperatively cancel one active Demo Run
      description: A Run waiting on an exact-session approval is denied through the existing Protect service before Runner cancellation.
      x-implementation-phase: 16
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/DemoRunId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DemoCancelRunRequest' }
      responses:
        '200':
          description: Current Run state after the idempotent cancellation request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoRunEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/demo/runs/{runId}/events:
    get:
      tags: [Demo]
      operationId: streamDemoRunEvents
      summary: Stream one Run's durable public control events
      description: The first fresh connection receives an atomic snapshot. Last-Event-ID resumes only demo.run rows scoped to this Run; retention gaps emit reset. No prompt, completion, tool argument, authorization value, or raw Trace field is present.
      x-implementation-phase: 16
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/DemoRunId'
        - $ref: '#/components/parameters/LastEventId'
      responses:
        '200':
          description: snapshot, run.status, run.step, run.trace_linked, run.approval_linked, run.finished, reset, and heartbeat events
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

