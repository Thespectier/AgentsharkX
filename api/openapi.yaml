      summary: Create or replace one verified agentgateway policy value
      description: |
        Writes only the path identified by resourceId while preserving all
        unrelated source-owned configuration. The result is read back and
        verified before success is returned. The complete PromptGuard and
        McpGuardrails parent objects are replaced atomically, preserving their
        ordered request/response and processor arrays; array members do not
        receive fabricated resource identities.
      x-implementation-phase: 11
