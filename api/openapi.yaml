        complete refetched document. The two global Guardrail paths follow the
        native editor semantics: deleting /llm/policies/guardrails or
        /mcp/policies/mcpGuardrails removes that configuration key rather than
        retaining a null marker.
      x-implementation-phase: 11
      x-implementation-status: implemented
      parameters:
